[project]
name = "spaces-mockup-mcp"
version = "0.1.0"
description = "Synthetic Cisco Spaces + Webex Workspaces MCP for local workstations"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [".venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
